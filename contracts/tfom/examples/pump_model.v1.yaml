# 水泵群建模视图物模型（scripts/build_pump_dataset.py 产出）。
#
# **为什么是泵群不是逐台**：逐台功耗有实测，但流量只有总管测点
# （chw_A1/A2.f、cw_A1/A2.f），逐台流量得靠泵频加权分摊（A-05）——
# 那是假设不是测量。泵群口径下总功耗与总流量都是实测，标签与自变量
# 都不依赖分摊假设。
#
# **与冷却塔风机的关键差别**：风机侧没有任何风量测点，功耗只能由频率和
# 台数去猜，实测七个幂律写法全部收敛到 R²≈0.54（信息瓶颈）。水泵侧流量
# 是实测的，P = f(Q, N, f) 定得住。
contract: TFOM
contract_version: "1.0"
model_id: pump_model
version: "1.0"
properties:
  freq_p1:
    name_zh: 1 号泵频率（未运行为空）
    unit: Hz
    dtype: float
    role: control
    quantity_kind: frequency
    min_value: 0.0
    max_value: 60.0
  freq_p2:
    name_zh: 2 号泵频率（未运行为空）
    unit: Hz
    dtype: float
    role: control
    quantity_kind: frequency
    min_value: 0.0
    max_value: 60.0
  freq_p3:
    name_zh: 3 号泵频率（未运行为空）
    unit: Hz
    dtype: float
    role: control
    quantity_kind: frequency
    min_value: 0.0
    max_value: 60.0
  freq_p4:
    name_zh: 4 号泵频率（未运行为空）
    unit: Hz
    dtype: float
    role: control
    quantity_kind: frequency
    min_value: 0.0
    max_value: 60.0
  freq_sum:
    name_zh: 运行泵频率之和（并联总转速的自然聚合）
    unit: Hz
    dtype: float
    role: control
    quantity_kind: frequency
    min_value: 0.0
    max_value: 240.0
  freq_spread:
    name_zh: 运行泵台间频率极差（台间不同步的程度）
    unit: Hz
    dtype: float
    role: control
    quantity_kind: frequency
    min_value: 0.0
    max_value: 60.0
  power_total:
    name_zh: 泵群总功耗
    unit: kW
    dtype: float
    role: target
    quantity_kind: power
    min_value: 0.0
    max_value: 5000.0
  flow_total:
    name_zh: 总管流量（两路之和）
    unit: m3/h
    dtype: float
    role: state
    quantity_kind: volume_flow
    min_value: 0.0
    max_value: 20000.0
  run_count:
    name_zh: 运行泵台数
    unit: "1"
    dtype: integer
    role: control
    quantity_kind: dimensionless
    min_value: 0.0
    max_value: 8.0
  freq_mean:
    name_zh: 运行泵平均频率
    unit: Hz
    dtype: float
    role: control
    quantity_kind: frequency
    min_value: 0.0
    max_value: 60.0
  freq_max:
    name_zh: 运行泵最高频率
    unit: Hz
    dtype: float
    role: control
    quantity_kind: frequency
    min_value: 0.0
    max_value: 60.0
  flow_per_pump:
    name_zh: 单泵平均流量（总流量 ÷ 运行台数）
    unit: m3/h
    dtype: float
    role: state
    quantity_kind: volume_flow
    min_value: 0.0
    max_value: 10000.0
  t_supply:
    name_zh: 总管供水温度
    unit: Cel
    dtype: float
    role: state
    quantity_kind: temperature
    min_value: -5.0
    max_value: 60.0
  t_return:
    name_zh: 总管回水温度
    unit: Cel
    dtype: float
    role: state
    quantity_kind: temperature
    min_value: -5.0
    max_value: 60.0
  delta_t:
    name_zh: 供回水温差
    unit: K
    dtype: float
    role: state
    quantity_kind: temperature_difference
    min_value: -30.0
    max_value: 30.0
  chiller_run_count:
    name_zh: 运行冷机台数
    unit: "1"
    dtype: integer
    role: state
    quantity_kind: dimensionless
    min_value: 0.0
    max_value: 8.0
  ambient_t:
    name_zh: 环境温度
    unit: Cel
    dtype: float
    role: disturbance
    quantity_kind: temperature
    min_value: -40.0
    max_value: 60.0
