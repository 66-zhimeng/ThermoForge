[project]
name = "thermoforge"
version = "0.1.0"
description = "Autonomous physics-data hybrid modeling research system for data-centric HVAC"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "openai>=1.0",
]

[project.scripts]
tf = "thermoforge_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/thermoforge_core",
    "src/thermoforge_data",
    "src/thermoforge_research",
    "src/thermoforge_models",
    "src/thermoforge_runtime",
    "src/thermoforge_cli",
    "src/thermoforge_agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 系统 Temp\pytest-of-zq 由其他账户创建且 ACL 受限（Windows），
# pytest 默认 basetemp 会撞权限，改用仓库本地目录
addopts = "--basetemp=.pytest_basetemp -m \"not slow\""
markers = [
    "slow: 慢速集成测试（如 43MB 真实工作簿导入），默认跳过，用 -m slow 触发",
]
